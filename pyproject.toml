[project]
name = "investments"
version = "0.1.28"
description = "Analysis of Interactive Brokers reports for tax reporting in Russia"
readme = "README.md"
license = "MIT"
authors = ["Maxim Andreev <andreevmaxim@gmail.com>"]
repository = "https://github.com/qk4l/investments"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment"
]
requires-python = ">=3.11,<4.0"

dependencies = [
    "requests>=2.31,<3.0",
    "tabulate>=0.9,<1.0",
    "aiomoex>=2.0,<3.0",
    "WeasyPrint>=58.0,<59.0",
    "jinja2>=3.1,<4.0",
    "google-auth-oauthlib==1.2.3",
    "google_spreadsheet==0.0.6",
    "googleapis-common-protos==1.72.0",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2,<8.0",
    "mypy>=1.1,<2.0",
    "wemake-python-styleguide>=0.17,<1.0",
    "types-requests>=2.28,<3.0",
    "types-tabulate>=0.9,<1.0"
]

[project.scripts]
ibtax = "investments.ibtax.ibtax:main"
ibdds = "investments.ibdds.ibdds:main"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]

